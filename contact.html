    <section class="page-hero">
        <div class="container contact-panel reveal">
            <p class="eyebrow">Signal in</p>
            <h1>Send a clean packet.</h1>
            <p class="muted">Internships, hardware collaboration, or a question about a board — this is the shortest path.</p>

            <form action="https://formsubmit.co/6dab04d7d1ecd94a6ca9b7f2c355960c" method="POST" class="contact-form">
                <input type="hidden" name="_captcha" value="false">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="What are we building?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send</button>
            </form>

            <div class="contact-links">
                <a href="mailto:trot.davis2003@gmail.com">
                    <span>Email</span>
                    trot.davis2003@gmail.com
                </a>
                <a href="https://www.linkedin.com/in/trot-davis-942286325/" target="_blank" rel="noopener noreferrer">
                    <span>LinkedIn</span>
                    /in/trot-davis
                </a>
            </div>
        </div>
    </section>

    <footer class="site-footer">
